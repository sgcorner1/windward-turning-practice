<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                font-family: sans-serif;
                color: #FFFFFF;
            }
            body {
                background-color: #111133;
            }
            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3dvh;
            }
            button {
                font-size: 1.25rem;
                font-weight: bold;
                width: 100%;
                background-color: #222244;
                border-color: #070722;
                border-width: 2px;
                border-radius: 5px;
            }
            button:hover {
                background-color: #171737;
            }
            .hidden {
                display: none;
            }
            #question {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5dvw;
            }
            #change-bearing-wrapper {
                align-content: center;
                width: fit-content;
            }
            #change-bearing-label {
                font-size: 1rem;
                font-weight: bold;
            }
            #prompt {
                width: 100%;
                text-align: center;
                font-size: 2.5rem;
                font-weight: bold;
            }
            #result {
                width: 100%;
                text-align: center;
                font-size: 1.5rem;
                font-weight: bold;
            }
            #result.correct {
                color: #44EE44;
            }
            #result.incorrect  {
                color: #EE4444;
            }
            #boat_interface {
                display: flex;
                flex-direction: row;
                width: 42dvw;
                gap: 2%;
            }
            #compass {
                width: 20dvw;
                height: 20dvw;
                position: relative;
                border-style: solid;
                border-color: #070722;
                border-width: 2px;
                background-color: #222266;
                svg {
                    position: absolute;
                }
            }
            #wind {
                top: 10%;
                left: 39%;
                width: 22%;
            }
            #boat-wrapper {
                width: 100%;
                height: 100%;
            }
            #boat {
                top: 20%;
                left: 40%;
                width: 20%;
            }
            #mainmast {
                top: 57%;
                left: 31%;
                width: 38%;
            }
            #foremast {
                top: 40%;
                left: 33%;
                width: 34%;
            }
            #starboard-arrow {
                top: 23%;
                left: 58%;
                width: 20%;
            }
            #larboard-arrow {
                top: 23%;
                left: 22%;
                width: 20%;
            }
            #controls {
                display: flex;
                flex-direction: column;
                gap: 5%;
                width: 20dvw;
                .mast-controls {
                    display: flex;
                    flex-direction: column;
                    gap: 2%;
                    .button-label {
                        display: inline;
                        text-align: center;
                        font-size: 1.5rem;
                        font-weight: bold;
                    }
                    .button-span {
                        display: flex;
                        gap: 2%;
                    }
                }
                button {
                    bottom: 0%;
                }
            }
        </style>
    </head>
    <body>

                                <path style="display:inline;fill:#4db255;fill-opacity:1;stroke:#000000;stroke-width:0.3;stroke-dasharray:none;stroke-opacity:1"

                            </g></svg>
                        </div>
                    </div>
                    <div id="controls">
                        <div id="fore-controls" class="mast-controls">
                            <div class="button-label">Fore:</div>
                            <div class="button-span">
                                <button onclick="braceFore(hardLarboard())">Larbord</button>
                                <button onclick="braceFore(shiver())">Shiver</button>
                                <button onclick="braceFore(hardStarboard())">Starboard</button>
                            </div>
                        </div>
                        <div id="main-controls" class="mast-controls">
                            <div class="button-label">Main:</div>
                            <div class="button-span">
                                <button onclick="braceMain(hardLarboard())">Larbord</button>
                                <button onclick="braceMain(shiver())">Shiver</button>
                                <button onclick="braceMain(hardStarboard())">Starboard</button>
                            </div>
                        </div>
                        <button onclick="checkAnswer();">Submit</button>
                    </div>
                </div>
                <div id="prompt"></div>
                <div id="result"></div>
            </div>
            <div id="change-bearing-wrapper"><input id="change-bearing" type="checkbox"><span id="change-bearing-label">Change bearing each question</span></div>
        </main>
        <script>
            const WIND_ICON = document.getElementById("wind");
            const BOAT_ICON = document.getElementById("boat-wrapper");
            const FORE_ICON = document.getElementById("foremast");
            const MAIN_ICON = document.getElementById("mainmast");
            const LARBOARD_ARROW = document.getElementById("larboard-arrow");
            const STARBOARD_ARROW = document.getElementById("starboard-arrow");
            const CHANGE_BEARING_CHECKBOX = document.getElementById("change-bearing");
            const PROMPT_DIV = document.getElementById("prompt");
            const RESULT_DIV = document.getElementById("result");

            var windAngle = 0;
            var bearing = 0;
            var foreRotation = 0;
            var mainRotation = 0;
            var turningLarboard = true;

            function generateQuestion() {
                windAngle = Math.floor(Math.random() * 360);
                turningLarboard = Math.random() < 0.5;
                foreRotation = 0;
                mainRotation = 0;
                PROMPT_DIV.innerText = `Turn ${turningLarboard ? "larboard" : "starboard"}`;
                (turningLarboard ? LARBOARD_ARROW : STARBOARD_ARROW).classList.remove("hidden");
                (!turningLarboard ? LARBOARD_ARROW : STARBOARD_ARROW).classList.add("hidden");
                bearing = 0;
                if (CHANGE_BEARING_CHECKBOX.checked) {
                    bearing = Math.floor(Math.random() * 360);
                }
                updateCompass();
            }

            function checkAnswer() {
                var foreExpected = turningLarboard ? foreTurnLarboard() : foreTurnStarboard();
                var mainExpected = turningLarboard ? foreTurnStarboard() : foreTurnLarboard();
                const beamReach = 85 <= windAngle && windAngle <= 95 || 265 <= windAngle && windAngle <= 275
                if (
                    (Math.abs(foreRotation - foreExpected) <= 5 || beamReach && foreExpected == -foreRotation && (foreExpected == -45 || foreExpected == 45)) &&
                    (Math.abs(mainRotation - mainExpected) <= 5 || beamReach && mainExpected == -mainRotation && (mainExpected == -45 || mainExpected == 45))) {
                    RESULT_DIV.innerText = "Correct";
                    RESULT_DIV.classList.remove("incorrect");
                    RESULT_DIV.classList.add("correct");
                    generateQuestion();
                } else {
                    RESULT_DIV.innerText = "Incorrect";
                    RESULT_DIV.classList.remove("correct");
                    RESULT_DIV.classList.add("incorrect");
                }
            }

            function hardStarboard() {
                return 45;
            }

            function hardLarboard() {
                return -45;
            }

            function shiver() {
                return Math.max(-45, Math.min(45, (windAngle < 180 ? windAngle + 90 : windAngle - 90) % 360 - 180));
            }

            function foreTurnLarboard() {
                if (0 <= windAngle && windAngle < 180) {
                    return shiver();
                } else if (180 <= windAngle && windAngle < 270) {
                    return hardStarboard();
                } else if (270 <= windAngle && windAngle <= 360) {
                    return hardLarboard();
                }
                return 0;
            }

            function foreTurnStarboard() {
                if (0 <= windAngle && windAngle < 90) {
                    return hardStarboard();
                } else if (90 <= windAngle && windAngle < 180) {
                    return hardLarboard();
                } else if (180 <= windAngle && windAngle <= 360) {
                    return shiver();
                }
                return 0;
            }

            function updateCompass() {
                BOAT_ICON.style.rotate = bearing + "deg";
                WIND_ICON.style.rotate = windAngle + bearing + "deg";
                FORE_ICON.style.rotate = foreRotation + "deg";
                MAIN_ICON.style.rotate = mainRotation + "deg";
            }

            function braceFore(angle) {
                foreRotation = angle;
                updateCompass();
            }
            function braceMain(angle) {
                mainRotation = angle;
                updateCompass();
            }

            function init() {
                CHANGE_BEARING_CHECKBOX.checked = false;
                generateQuestion();
                CHANGE_BEARING_CHECKBOX.checked = true;
            }
           
            init();
        </script>
    </body>
</html>
